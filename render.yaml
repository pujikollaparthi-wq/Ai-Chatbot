services:
  - type: web
    name: ai-chatbot-enterprise
    runtime: python
    buildCommand: "./build.sh"
    startCommand: "gunicorn enterprise_platform.wsgi:application"
    plan: free
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.8
      - key: DEBUG
        value: False
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: "*"
      - key: GEMINI_API_KEY
        sync: false
