<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <style>
        body {
            margin: 0;
            height: 100vh;
            background: url('/static/admin_bg.jpg') no-repeat center center fixed;
            background-size: cover;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
        }

        .dashboard-container {
            background-color: rgba(255, 255, 255, 0.85);
            padding: 40px;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 0 20px rgba(0,0,0,0.3);
            width: 400px;
        }

        .btn-admin {
            margin: 10px 0;
            width: 100%;
        }

        h1 {
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div class="dashboard-container">
        <h1>Admin Dashboard</h1>
        <p>Manage users and data below:</p>
        <a href="#" class="btn btn-primary btn-admin">Add User</a>
        <a href="#" class="btn btn-warning btn-admin">Edit User</a>
        <a href="#" class="btn btn-danger btn-admin">Delete User</a>
        <a href="#" class="btn btn-success btn-admin">View Reports</a>
    </div>
</body>
</html>
